name: Build and Deploy Jupyter Book

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Jupyter Book
        run: |
          pip install --upgrade pip
          pip install jupyter-book

      - name: Build Jupyter Book
        run: jupyter-book build .

      - name: Create root index redirect
        run: |
          if [ ! -f "_build/html/index.html" ]; then
            echo '<meta http-equiv="Refresh" content="0; url=md/intro.html" />' > _build/html/index.html
          fi

      - name: Copy additional HTML assets
        run: |
          mkdir -p _build/html/md
          cp md/*.html _build/html/md/ 2>/dev/null || true

      - name: Verify build output
        run: |
          if [ ! -f "_build/html/index.html" ]; then
            echo "ERROR: Build failed - index.html not found in _build/html/"
            ls -la _build/html/ || echo "Directory is empty or missing"
            exit 1
          fi
          echo "Build successful! Files in _build/html:"
          ls _build/html/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/html
